<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../src/styles.css"><style>
.mock-scene{position:absolute;inset:4%;border:1px solid rgba(57,50,41,.08);background:radial-gradient(circle at 50% 45%,rgba(255,255,255,.46),rgba(221,211,192,.3));overflow:hidden}.mock-ring{position:absolute;border:2px solid #aaa08f;border-radius:50%;left:17%;right:17%;top:20%;bottom:20%;transform:rotate(-8deg)}.mock-ring:after{content:"";position:absolute;inset:18%;border:1px solid #bdb2a1;border-radius:50%}.mock-sat{position:absolute;right:18%;top:22%;width:58px;height:18px;background:#4f648c;box-shadow:-24px 0 0 #4f648c,24px 0 0 #4f648c}.mock-grid{position:absolute;inset:14%;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,1fr);gap:22px}.mock-server{border:1px solid #8b8174;background:#eee8db;border-radius:8px}.mock-space{background:radial-gradient(circle at 45% 50%,#687a94 0 17%,#121722 18% 100%)}.mock-space:after{content:"";position:absolute;width:72%;height:45%;border:1px solid rgba(237,228,207,.7);border-radius:50%;left:14%;top:28%;transform:rotate(-8deg)}.mock-network span{position:absolute;width:8px;height:8px;background:#8c8173;border-radius:50%}
</style></head><body><div class="app-shell chapter-index" id="app"><div class="desk-noise"></div><header class="app-bar"><button class="brand"><span>EW</span><b>FIELD NOTES</b></button><div class="coords">VANCOUVER · 49.2827° N · 123.1207° W</div><div class="top-links"><a>RÉSUMÉ</a><a>GITHUB</a><a>SAY HELLO ↗</a><span class="utility-divider"></span><button class="top-control" aria-pressed="true"><span>◐</span><b>LIGHT ON</b></button><button class="top-control" aria-pressed="false"><span>♪</span><b>SOUND</b></button></div></header><main class="viewport-stage"><div class="dossier-shell"><nav class="desktop-tabs" id="tabs"></nav><div class="folder-frame"><div class="folder-label"><span>EW / ACTIVE FILE</span><span id="code"></span></div><button class="cat-button"><img src="../public/assets/cat-avatar.png"><span>incident commander</span></button><section class="paper-stage"><div class="chapter-copy-panel"><div class="copy-stack" id="copy"></div></div><div class="visual-panel"><div class="mock-scene" id="scene"></div><div class="visual-overlay" id="overlay"></div></div></section></div></div><div class="keyboard-hint"><span><kbd>1-5</kbd> jump to a chapter</span><i></i><span><kbd>←</kbd><kbd>→</kbd> switch chapters</span></div><div class="mobile-edge-controls"><button>‹</button><span id="progress"></span><button>›</button></div></main><nav class="mobile-dock" id="dock"></nav></div><script>
const chapters=[['index','00','INDEX','Home'],['work','01','WORK','Work'],['lab','02','LAB','Lab'],['space','03','SPACE','Space'],['people','04','PEOPLE','People']];
const requested=location.hash.slice(1);const active=chapters.some(c=>c[0]===requested)?requested:'index';document.getElementById('app').className='app-shell chapter-'+active;const idx=chapters.findIndex(c=>c[0]===active);document.getElementById('code').textContent=chapters[idx][1]+' / '+chapters[idx][2];document.getElementById('progress').textContent=chapters[idx][1]+' / 04';
const copy={
index:`<p class="eyebrow"><span class="status-dot"></span> SOFTWARE ENGINEER · BUILDER · HUMAN</p><h1 class="hero-name"><span>Ernest</span><em>Wong.</em></h1><p class="hero-thesis">I build systems that <strong>survive contact with reality.</strong></p><p class="hero-support">My work spans production systems, automation, applied ML, mission software, and the teams behind them.</p><div class="action-row"><button class="primary-action">open the field note <span>→</span></button><a class="text-action">resume.pdf ↗</a></div><div class="compact-proof"><div><strong>$100M+</strong><span>production</span></div><div><strong>50+</strong><span>apps</span></div><div><strong>8+</strong><span>envs</span></div><div><strong>300+</strong><span>people</span></div></div>`,
work:`<p class="eyebrow">CASE 01 · PRODUCTION</p><h2>Software with<br><em>consequences.</em></h2><p class="chapter-lead">I like the part after the demo, when software has to survive maintenance windows, broken configs, databases, and real users.</p><div class="role-block"><div class="role-meta"><span>ISED · GOVERNMENT OF CANADA</span><span>2025 - PRESENT</span></div><h3>Software Engineer Intern</h3><div class="metric-strip three"><div><strong>$100M+</strong><span>platform</span></div><div><strong>8+</strong><span>environments</span></div><div><strong>50+</strong><span>applications</span></div></div></div><div class="stack-chips"><span>Java</span><span>Python</span><span>GraphQL</span><span>Jenkins</span><span>AWS</span></div><button class="secondary-action">open production case file ↗</button>`,
lab:`<p class="eyebrow">CASE 02 · APPLIED ML</p><h2>Keep the paper.<br><em>Lose the noise.</em></h2><p class="chapter-lead">CleanListen turns messy academic PDFs into cleaner text for screen readers and TTS without summarizing away the research.</p><div class="metric-strip three"><div><strong>91.2%</strong><span>accuracy</span></div><div><strong>89.7%</strong><span>KEEP F1</span></div><div><strong>94.0%</strong><span>specificity</span></div></div><div class="stack-chips"><span>Python</span><span>scikit-learn</span><span>Pandas</span><span>CLI</span><span>CI</span></div><div class="action-row tight"><button class="secondary-action">open ML case file ↗</button><a class="text-action">GitHub ↗</a></div>`,
space:`<p class="eyebrow">CASE 03 · MISSION SYSTEMS</p><h2>Software that<br><em>leaves the building.</em></h2><p class="chapter-lead">Mission operations, telemetry, embedded systems, and a high-altitude balloon that forced software decisions to meet physical reality.</p><div class="metric-strip three"><div><strong>~30 km</strong><span>balloon</span></div><div><strong>10+</strong><span>sensors</span></div><div><strong>2028</strong><span>mission target</span></div></div><div class="action-row space-links"><a class="secondary-action link-button">ALEASAT ↗</a><a class="text-action">SFU SAT ↗</a></div><button class="case-link">read the mission log →</button>`,
people:`<p class="eyebrow">CASE 04 · PEOPLE</p><h2>Good systems need<br><em>humans in the loop.</em></h2><p class="chapter-lead">The projects I remember most are the ones where I liked the people enough to keep building with them.</p><div class="metric-strip three"><div><strong>300+</strong><span>AI attendees</span></div><div><strong>100+</strong><span>students</span></div><div><strong>200</strong><span>mentoring emails</span></div></div><blockquote class="people-quote">“Bring people with you.”</blockquote><button class="secondary-action">open the people file ↗</button>`};
document.getElementById('copy').innerHTML=copy[active];
const tabs=document.getElementById('tabs'),dock=document.getElementById('dock');chapters.forEach(c=>{tabs.innerHTML+=`<button class="${c[0]===active?'active':''}"><span>${c[1]}</span><b>${c[2]}</b></button>`;dock.innerHTML+=`<button class="${c[0]===active?'active':''}"><span class="dock-number">${c[1]}</span><span>${c[3]}</span></button>`});
const scene=document.getElementById('scene'),overlay=document.getElementById('overlay');if(active==='index'){scene.innerHTML='<div class="mock-ring"></div><div class="mock-sat"></div>';overlay.innerHTML='<div class="orbit-labels"><span class="orbit-chip prod">PROD<small>ship it</small></span><span class="orbit-chip ml">ML<small>clean it</small></span><span class="orbit-chip orbit">ORBIT<small>ALEASAT</small></span><span class="orbit-chip people">300+<small>bring people</small></span><span class="map-caption">CURRENT TRAJECTORY</span><span class="hand-note">apparently this became a career ↗</span></div>'}else if(active==='work'){scene.innerHTML='<div class="mock-grid">'+Array(8).fill('<div class="mock-server"></div>').join('')+'</div>';overlay.innerHTML='<div class="console-card visual-overlay-card"><div class="console-title"><span>release_simulator.sh</span><span class="console-led"></span></div><div class="env-row"><span>QA</span><span>UAT</span><span class="active">PROD</span></div><pre>$ ready to deploy\n&gt; checks: waiting\n&gt; maintenance window: open\n▮</pre><button class="visual-control">simulate a release</button></div>'}else if(active==='lab'){overlay.innerHTML='<div class="paper-demo visual-overlay-card"><div class="demo-toolbar"><span>RAW PDF</span><b>noise detected</b></div><div class="demo-paper"><span class="noise-line">JOURNAL OF EXAMPLE RESEARCH · VOL. 14</span><strong>3. Methods</strong><p>We evaluate the proposed method on a held-out set of research documents.</p><span class="noise-line">Downloaded from publisher.example · 04:13 PM</span><p>The classifier predicts whether each extracted line should be kept for listening.</p><span class="noise-line">© 2026 Example Publisher · Page 7</span></div><button class="visual-control">run CleanListen</button></div>'}else if(active==='space'){scene.classList.add('mock-space');overlay.innerHTML='<div class="space-overlay"><span class="altitude-tag">HAB · ~30 KM</span><span class="orbit-tag">ALEASAT · ORBIT</span><span class="mission-caption">software → radio → physics</span></div>'}else{scene.classList.add('mock-network');for(let i=0;i<30;i++){const s=document.createElement('span');s.style.left=(10+(i*37)%80)+'%';s.style.top=(10+(i*53)%80)+'%';scene.appendChild(s)}overlay.innerHTML='<div class="people-overlay"><div class="sticky-note"><span class="tape"></span>bring people<br><strong>with you.</strong></div><span class="network-label a">AI COFFEE</span><span class="network-label b">SAT</span><span class="network-label c">MENTORING</span></div>'}
</script></body></html>
